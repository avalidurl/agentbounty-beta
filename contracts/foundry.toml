[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [
    { access = "read-write", path = "./out" },
    { access = "read",       path = "./script/config" },
    { access = "write",      path = "./out/deployment-84532.json" },
    { access = "write",      path = "./out/deployment-8453.json" },
    { access = "write",      path = "./out/deployment-31337.json" },
]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1024, depth = 256 }
verbosity = 4

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
sort_imports = true

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
base         = { key = "${BASESCAN_API_KEY}", chain = 8453,  url = "https://api.basescan.org/api" }

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base         = "${BASE_RPC_URL}"
anvil        = "http://127.0.0.1:8545"
